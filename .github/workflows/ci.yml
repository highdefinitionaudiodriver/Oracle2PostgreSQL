# ======================================================================
# Oracle → PostgreSQL Migration Tool - CI Pipeline
# ======================================================================
# Runs the full test suite on every push and pull request.
# Matrix: Python 3.11 + 3.12 on ubuntu-latest.
# ======================================================================

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest test_conversion.py -v --tb=short --junitxml=test-results.xml

      - name: Run tests with coverage
        run: |
          python -m pytest test_conversion.py --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml

  # ------------------------------------------------------------------
  # Docker build verification
  # ------------------------------------------------------------------
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image (base)
        run: docker build --target base -t oracle2pg:latest .

      - name: Build Docker image (test)
        run: docker build --target test -t oracle2pg:test .

      - name: Run tests in Docker
        run: docker run --rm oracle2pg:test
